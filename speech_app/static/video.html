<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f0">
<title>Kalam · Vidéo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icone-180.png">
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalam">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/video.css">
</head>
<body>
<div class="ecran">
  <header class="entete"></header>

  <!-- 1. dépôt -->
  <section id="depot" class="vue">
    <div class="tete-page"><h1>Vidéo</h1><p class="meta">Dépose un fichier audio ou vidéo : les sous-titres français arrivent synchronisés.</p></div>
    <label id="zone" class="zone" for="fichier">
      <input id="fichier" class="visuellement-cache" type="file" accept="video/*,audio/*">
      <span id="zone-titre" class="zone-titre">Glisse un fichier ici</span>
      <span id="zone-aide" class="caps">ou touche pour le choisir</span>
    </label>
    <p id="erreur-depot" class="erreur msg" role="alert" hidden></p>
    <div class="moteur">
      <p class="caps">Moteur</p>
      <div id="choix-moteurs" class="seg" role="radiogroup" aria-label="Moteur"></div>
      <p id="aide-moteur" class="aide-moteur"></p>
    </div>
    <div class="bas"><button id="lancer" class="rond plein" type="button"><span class="disque"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span class="lib">sous-titrer</span></button></div>
  </section>

  <!-- 2. progression -->
  <section id="progression" class="vue" hidden aria-live="polite">
    <div class="tete-page"><h1 id="prog-titre">En cours</h1></div>
    <ol id="etapes" class="etapes"></ol>
    <div class="barre" aria-hidden="true"><i id="barre"></i></div>
    <p class="meta"><span id="prog-temps" class="mono">00:00</span> · la durée dépend du moteur et de la machine</p>
    <p id="prog-erreur" class="erreur msg" role="alert" hidden></p>
    <div class="bas"><button id="reessayer" class="rond" type="button" hidden><span class="disque"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 107-7M5 5v5h5"/></svg></span><span class="lib">recommencer</span></button></div>
  </section>

  <!-- 3. résultat -->
  <section id="resultat" class="vue" hidden>
    <div class="tete-page"><h1 id="res-titre">Vidéo</h1><p id="res-meta" class="meta"></p></div>
    <div class="duo">
      <div class="cadre"><video id="lecteur" controls playsinline preload="metadata"></video></div>
      <div id="transcript" class="defile transcript"><ol id="segments" class="segments"></ol></div>
    </div>
    <div class="commandes">
      <button id="options-res" class="texte caps" type="button" aria-expanded="false">Options</button>
      <a id="rapport" class="rond plein" href="#"><span class="disque"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h7l4 4v12H7zM14 4v4h4M10 12h5M10 16h5"/></svg></span><span class="lib">rapport</span></a>
    </div>
    <p id="rapport-note" class="meta" hidden></p>
  </section>
</div>
<script src="/static/marque.js"></script>
<script src="/static/commun.js"></script>
<script src="/static/video.js"></script>
</body>
</html>
