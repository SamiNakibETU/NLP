<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Kalam · Rapport</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icone-180.png">
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/rapport.css">
</head>
<body>
<div class="ecran">
  <header class="entete"></header>
  <div class="tete-page">
    <div class="titre-rangee"><h1 id="titre" class="titre">Rapport</h1><button id="options-rapport" class="icone-btn" type="button" aria-label="Exports et options" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></div>
    <p id="meta" class="meta nombres"></p>
    <div id="onglets" class="seg" role="tablist" aria-label="Sections du rapport" hidden>
      <button id="o-resume" type="button" role="tab" data-valeur="resume" aria-selected="true" aria-controls="p-resume">Résumé</button>
      <button id="o-transcript" type="button" role="tab" data-valeur="transcript" aria-selected="false" aria-controls="p-transcript" tabindex="-1">Transcript</button>
      <button id="o-details" type="button" role="tab" data-valeur="details" aria-selected="false" aria-controls="p-details" tabindex="-1">Détails</button>
    </div>
  </div>

  <!-- état : absent / en cours / erreur -->
  <section id="etat" class="etat-bloc" hidden aria-live="polite">
    <div id="etat-absent" hidden>
      <p class="intro">Le rapport distingue les voix, relit la traduction et résume ce qui a été dit. Compte quelques minutes de calcul.</p>
      <div class="actions">
        <button id="choix-options" class="pilule" type="button"><span>Options</span><svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke-width="1.6"/></svg></button>
        <button id="generer" class="pilule noire grande" type="button">Générer le rapport</button>
      </div>
    </div>
    <div id="etat-cours" hidden>
      <p class="prog-ligne"><span id="etape" class="swap">En attente du calcul</span><span id="pct" class="nombres">0 %</span></p>
      <div class="barre"><i id="barre"></i></div>
      <p class="petit"><span id="temps" class="nombres">00:00</span> écoulées</p>
    </div>
    <div id="etat-erreur" hidden>
      <p class="intro"><b>Le rapport n'a pas pu être généré.</b> <span id="erreur-texte"></span></p>
      <div class="actions"><button id="reessayer" class="pilule" type="button">Réessayer</button></div>
    </div>
  </section>

  <main id="rapport" class="defile" hidden>
    <div id="p-resume" role="tabpanel" aria-labelledby="o-resume" tabindex="0">
      <p id="voix-erreur" class="msg erreur" role="alert" hidden></p>
      <div id="resume" class="resume"></div>
    </div>
    <div id="p-transcript" role="tabpanel" aria-labelledby="o-transcript" tabindex="0" hidden>
      <div id="transcript" class="transcript"></div>
    </div>
    <div id="p-details" role="tabpanel" aria-labelledby="o-details" tabindex="0" hidden>
      <dl id="details-liste" class="details"></dl>
    </div>
  </main>

  <div id="lecture" class="lecture" hidden>
    <span class="lecture-point" aria-hidden="true"></span><span id="lecture-temps" class="nombres">00:00</span>
    <button id="lecture-stop" class="lecture-stop" type="button">Arrêter</button>
  </div>
  <audio id="audio" preload="none"></audio>
</div>
<script src="/static/marque.js"></script>
<script src="/static/commun.js"></script>
<script src="/static/rapport.js"></script>
</body>
</html>
